name: Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.0.0, or "next" for auto-increment)'
        required: false
        default: 'next'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history and tags for version calculation

      - name: Determine Release Tag
        id: tag
        shell: bash
        run: |
          # Fetch all tags so we can see the latest
          git fetch --tags
          
          INPUT_VERSION="${{ github.event.inputs.version }}"
          
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$INPUT_VERSION" != "next" ] && [ -n "$INPUT_VERSION" ]; then
            # User specified a custom version
            if [[ "$INPUT_VERSION" =~ ^v ]]; then
              VERSION="$INPUT_VERSION"
            else
              VERSION="v$INPUT_VERSION"
            fi
            echo "Determined user version: $VERSION"
          else
            # Calculate next version
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
            echo "Latest tag found: $LATEST_TAG"
            
            # Parse version components (assuming format vX.Y.Z)
            if [[ "$LATEST_TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              MAJOR="${BASH_REMATCH[1]}"
              MINOR="${BASH_REMATCH[2]}"
              PATCH="${BASH_REMATCH[3]}"
              # Increment patch version
              NEW_PATCH=$((PATCH + 1))
              VERSION="v$MAJOR.$MINOR.$NEW_PATCH"
            else
              VERSION="v1.0.0"
            fi
            echo "Auto-incremented to version: $VERSION"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Install NSIS
        run: |
          choco install nsis -y
          "$env:ChocolateyInstall\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "${env:ProgramFiles(x86)}\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Update Version Files
        run: |
          $version = "${{ steps.tag.outputs.version }}"
          $cleanVersion = $version.TrimStart('v')
          
          # Update wails.json productVersion
          $wailsJson = Get-Content wails.json | ConvertFrom-Json
          $wailsJson.info.productVersion = $cleanVersion
          $wailsJson | ConvertTo-Json -Depth 10 | Out-File wails.json -Encoding utf8
          
                    # Update version.go AppVersion constant
          $versionGo = @"
          package main
          
          // AppVersion represents the compiled version of the application.
          // This is overwritten dynamically during the GitHub Release workflow.
          const AppVersion = "$cleanVersion"
          "@
          $versionGo | Out-File version.go -Encoding utf8

      - name: Build Desktop Application
        run: |
          $env:PATH += ";$HOME/go/bin"
          wails build -platform windows/amd64 -nsis

      - name: Rename Executable and Installer for Release
        run: |
          mv build/bin/takeprint.exe build/bin/TakePrint-Desktop.exe
          mv build/bin/takeprint-*-installer.exe build/bin/TakePrint-Desktop-Installer.exe

      - name: Create GitHub Release and Upload Artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.version }}
          name: Release ${{ steps.tag.outputs.version }}
          body: |
            ### 📥 Installation & Setup
            * **Recommended**: Download and run **`TakePrint-Desktop-Installer.exe`**. It sets up Start Menu & Desktop shortcuts, registers the uninstaller, and enables automatic background updates.
            * **Portable**: Use **`TakePrint-Desktop.exe`** to run the app instantly without installation (does not support automatic updates).
            
            ---
            
            ### 🛠️ What's Changed
          generate_release_notes: true
          files: |
            build/bin/TakePrint-Desktop.exe
            build/bin/TakePrint-Desktop-Installer.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
